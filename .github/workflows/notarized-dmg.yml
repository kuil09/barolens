name: Barolens Notarized DMG

# Signing is opt-in, never a pull_request or pull_request_target operation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: barolens-notarization
  cancel-in-progress: false

jobs:
  verify-ci:
    if: github.repository == 'kuil09/barolens' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful main CI for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-success-gate.py
  notarized-dmg:
    needs: verify-ci
    if: github.repository == 'kuil09/barolens' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release-signing
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck exact-commit CI after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-success-gate.py
      - name: Validate tools
        run: |
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}')" = 26.4.1
          test "$(uname -m)" = arm64
      # Legacy encrypted environment entries remain bound until their owner re-registers them.
      - name: Check signing configuration without exposing values
        env:
          BAROLENS_CERTIFICATE_P12_BASE64: ${{ secrets.BAROLENS_CERTIFICATE_P12_BASE64 || secrets.LENS_CERTIFICATE_P12_BASE64 }}
          BAROLENS_CERTIFICATE_PASSWORD: ${{ secrets.BAROLENS_CERTIFICATE_PASSWORD || secrets.LENS_CERTIFICATE_PASSWORD }}
          BAROLENS_APPLE_ID: ${{ secrets.BAROLENS_APPLE_ID || secrets.LENS_APPLE_ID }}
          BAROLENS_APPLE_APP_PASSWORD: ${{ secrets.BAROLENS_APPLE_APP_PASSWORD || secrets.LENS_APPLE_APP_PASSWORD }}
          BAROLENS_TEAM_ID: ${{ vars.BAROLENS_TEAM_ID }}
        run: bash scripts/ci-notarize.sh preflight
      - name: Install packaging-only dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/barolens-packaging"
          "$RUNNER_TEMP/barolens-packaging/bin/pip" install -r Packaging/requirements.txt
      - name: Build, sign, notarize and verify app and DMG
        env:
          BAROLENS_CERTIFICATE_P12_BASE64: ${{ secrets.BAROLENS_CERTIFICATE_P12_BASE64 || secrets.LENS_CERTIFICATE_P12_BASE64 }}
          BAROLENS_CERTIFICATE_PASSWORD: ${{ secrets.BAROLENS_CERTIFICATE_PASSWORD || secrets.LENS_CERTIFICATE_PASSWORD }}
          BAROLENS_APPLE_ID: ${{ secrets.BAROLENS_APPLE_ID || secrets.LENS_APPLE_ID }}
          BAROLENS_APPLE_APP_PASSWORD: ${{ secrets.BAROLENS_APPLE_APP_PASSWORD || secrets.LENS_APPLE_APP_PASSWORD }}
          BAROLENS_TEAM_ID: ${{ vars.BAROLENS_TEAM_ID }}
        run: PATH="$RUNNER_TEMP/barolens-packaging/bin:$PATH" bash scripts/ci-notarize.sh build
      - name: Upload verified notarized deliverables only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: barolens-notarized-${{ github.sha }}
          path: |
            ${{ runner.temp }}/barolens-notarized-output/*.dmg
            ${{ runner.temp }}/barolens-notarized-output/*.sha256
            ${{ runner.temp }}/barolens-notarized-output/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral signing material on failure or cancellation
        if: always()
        run: bash scripts/ci-notarize.sh cleanup
